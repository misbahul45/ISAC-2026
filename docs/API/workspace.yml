info:
  name: ISAC-2026
  type: workspace

collections:
  - name: "System"
    path: "collections/System"
  - name: "Auth"
    path: "collections/Auth"
  - name: "Dashboard"
    path: "collections/Dashboard"
  - name: "Team"
    path: "collections/Team"
  - name: "File"
    path: "collections/File"
  - name: "ImageKit"
    path: "collections/ImageKit"
  - name: "Competitions"
    path: "collections/Competitions"
  - name: "Registration"
    path: "collections/Registration"
  - name: "Admin"
    path: "collections/Admin"

specs:

docs: |-
  # ISAC 2026 API Workspace

  Workspace Bruno/OpenCollection ini mencakup seluruh 50 route JSON API yang
  aktif. Kontrak canonical, endpoint matrix, environment, payload, auth, file,
  payment, dan urutan pengujian tersedia di `README.md`.

  Gunakan environment Local:
  - baseUrl: http://localhost:8080
  - apiToken: token Team dari Auth/login
  - adminToken: token Admin dari Auth/login

  Request memakai snake_case, response memakai camelCase, dan semua response
  aplikasi menggunakan envelope status/message/data/metadata/error.
