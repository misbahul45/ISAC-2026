docs: |-
  #### GET /api/todos — TodoController@index
  - **Deskripsi**: Ambil seluruh todo, terbaru dulu (`latest()`).
  - **Middleware & Auth**: Publik. Sumber: `routes/api.php:26`.
  - **Request**: Tidak ada.
  - **Alur Proses**: `todoService->getTodos()` →
    `todoRepository->allLatest()` → `Todo::latest()->get()`
    (`app/Repositories/TodoRepository.php:16-21`), dibungkus `TodoResource::collection`
    (`app/Http/Resources/TodoResource.php`).
  - **Database yang Terkena**: `todos` — SELECT
    (⚠️ Lampiran B #1: tabel `todos` belum punya migration → runtime error).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): `{status:'success', message:'Todos retrieved successfully.',
    data:[{id, title, is_completed, created_at, updated_at}]}`.
  - **Catatan**: ⚠️ Tidak ada pagination; response memuat semua baris.
