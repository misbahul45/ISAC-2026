http:
  method: PATCH
  url: "{{baseUrl}}/api/todos/{{todo_id}}"
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
          "title": "Beli kebutuhan lomba (revisi)",
          "is_completed": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
