docs: |-
  #### PATCH /api/todos/{todo} — TodoController@update
  - **Deskripsi**: Update `title` dan/atau `is_completed` satu todo.
  - **Middleware & Auth**: Publik. Sumber: `routes/api.php:28`. Route model
    binding otomatis ke `Todo` (`{todo}`).
  - **Request** (validasi `UpdateTodoRequest`,
    `app/Http/Requests/Todo/UpdateTodoRequest.php:17-22`):
    - `title`: sometimes, required, string, min:1, max:255
    - `is_completed`: sometimes, boolean
  - **Alur Proses**: `todoService->updateTodo($todo, validated)` →
    `todoRepository->update` (`app/Services/TodoService.php:39-42`,
    `app/Repositories/TodoRepository.php:34-39`).
  - **Database yang Terkena**: `todos` — UPDATE (`title`/`is_completed`)
    (⚠️ Lampiran B #1).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): `{status:'success', message:'Todo updated successfully.',
    data: TodoResource}`.
  - **Catatan**: ⚠️ Tidak ada otorisasi — siapa pun (publik) dapat ubah todo
    orang lain asalkan tahu UUID `todo` (Lampiran B #4).
