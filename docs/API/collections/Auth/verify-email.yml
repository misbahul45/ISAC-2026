info:
  name: verify-email
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/verify-email"
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
          "code": "{{otpCode}}"
      }
  auth:
    type: bearer
    token: "{{apiToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  #### POST /api/auth/verify-email — AuthController@verifyEmail
  - **Deskripsi**: Verifikasi email Team lalu arahkan ke pemilihan kompetisi.
  - **Middleware & Auth**: auth:sanctum (throttle:6,10). Sumber: `routes/api.php:90`.
  - **Request**: `code` required/string/size:6; Team diambil dari Bearer token.
  - **Alur Proses**: cari challenge VERIFY_EMAIL aktif milik Team, tandai single-use,
    lalu isi `teams.email_verified_at` dalam transaction.
  - **Database**: `auth_challenges` SELECT/UPDATE; `teams` UPDATE.
  - **Efek Samping**: Tidak ada.
  - **Response** (200): Team terbaru dan `redirectTo: /registration`.
