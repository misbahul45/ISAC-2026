docs: |-
  #### POST /api/auth/verify-email — AuthController@verifyEmail
  - **Deskripsi**: Verifikasi email → ubah status menjadi `ACTIVE`.
  - **Middleware & Auth**: auth:sanctum (throttle:6,10). Sumber: `routes/api.php:90`.
  - **Request** (`VerifyEmailRequest.php:14-19`): `email` required/email/
    exists:teams,email; `code` required/string/size:6.
  - **Alur Proses** (`AuthService::verifyEmail`, `app/Services/AuthService.php:171-192`):
    findValidVerificationCode (type verify_email, used_at null, expired_at>now) →
    findByEmail → DB::transaction: markTokenAsUsed + updateTeamStatus(`ACTIVE`).
  - **Database**: `password_reset_codes` SELECT+UPDATE; `teams` UPDATE status.
  - **Efek Samping**: Tidak ada.
  - **Response** (200): data null. (401) `INVALID_CREDENTIALS`; (422) `VALIDATION_ERROR`.
  - **Catatan**: ⚠️ Tidak cek ulang bahwa team masih `EMAIL_UNVERIFIED` sebelum
    update `ACTIVE` (Lampiran B #9).
