docs: |-
  #### POST /api/auth/forgot-password — AuthController@forgotPassword
  - **Deskripsi**: Kirim OTP reset password ke email team.
  - **Middleware & Auth**: Publik (throttle:3,15). Sumber: `routes/api.php:82`.
  - **Request** (`ForgotPasswordRequest.php:14-19`): `email` required/email/
    exists:teams,email.
  - **Alur Proses** (`AuthService::forgotPassword`, `app/Services/AuthService.php:75-92`):
    deleteOldResetCodes → generate 6 digit → createResetCode (`type` default
    `reset_password`) `expired_at=now+5m` → kirim `ResetPasswordMail`.
  - **Database**: `password_reset_codes` DELETE (kode lama) + INSERT.
  - **Efek Samping**: kirim `ResetPasswordMail`.
  - **Response** (200): `{email}`. (422) `VALIDATION_ERROR` bila email tak terdaftar.
  - **Catatan**: ⚠️ `deleteOldResetCodes` hapus SEMUA kode (tanpa filter type),
    membatalkan OTP `verify_email` yang masih aktif (Lampiran B #3).

