info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:8000/api/auth/register
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
          "email": "lkiokijoap@gmail.com",
          "password": "kirby1234",
          "password_confirmation": "kirby1234"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
