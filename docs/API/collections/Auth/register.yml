info:
  name: register
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
          "email": "{{registrationEmail}}",
          "password": "Password123!",
          "password_confirmation": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  #### POST /api/auth/register — AuthController@register
  - **Deskripsi**: Daftarkan akun team baru, lalu kirim OTP verifikasi email.
  - **Middleware & Auth**: Publik (throttle:3,1). Sumber: `routes/api.php:80`.
  - **Request** (`RegisterRequest.php:17-23`): `email` required/email/max:255/
    unique:teams,email; `password` required/min:8/confirmed
    (butuh `password_confirmation`).
  - **Alur Proses** (`AuthService::register`, `app/Services/AuthService.php:27-41`):
    DB::transaction → create Team status `INCOMPLETE` (password di-bcrypt via
    mutator `Team.php:114-119`); lalu `sendVerificationCode` (`AuthService.php:140-166`):
    cek status, hapus kode lama, generate 6 digit, simpan `type='verify_email'`,
    kirim `VerifyEmailMail`.
  - **Database**: `teams`, `auth_challenges`, dan `personal_access_tokens` INSERT.
  - **Efek Samping**: kirim `VerifyEmailMail`.
  - **Response** (201): token, principalType `TEAM`, Team, dan `redirectTo: /auth/verify-email`.
  - **Catatan**: Pengiriman email berada dalam transaksi; kegagalan provider me-roll back akun.
