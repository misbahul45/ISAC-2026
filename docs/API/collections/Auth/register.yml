docs: |-
  #### POST /api/auth/register — AuthController@register
  - **Deskripsi**: Daftarkan akun team baru, lalu kirim OTP verifikasi email.
  - **Middleware & Auth**: Publik. Sumber: `routes/api.php:44`.
  - **Request** (`RegisterRequest.php:17-23`): `email` required/email/max:255/
    unique:teams,email; `password` required/min:8/confirmed
    (butuh `password_confirmation`).
  - **Alur Proses** (`AuthService::register`, `app/Services/AuthService.php:27-41`):
    DB::transaction → createTeam status `EMAIL_UNVERIFIED` (password di-bcrypt via
    mutator `Team.php:114-119`); lalu `sendVerificationCode` (`AuthService.php:140-166`):
    cek status, hapus kode lama, generate 6 digit, simpan `type='verify_email'`,
    kirim `VerifyEmailMail`.
  - **Database**: `teams` INSERT; `password_reset_codes` INSERT (type verify_email).
    Migrasi `..._000006_create_teams_table.php`, `..._100851_create_password_reset_codes.php`.
  - **Efek Samping**: kirim `VerifyEmailMail`.
  - **Response** (201): `AuthResource` → id, code, email, status (uppercase →
    `"EMAIL_UNVERIFIED"`).
  - **Catatan**: ⚠️ `sendVerificationCode` dijalankan di luar transaksi → bila mail
    gagal, team sudah ada tapi OTP tak terkirim (Lampiran B #7).

