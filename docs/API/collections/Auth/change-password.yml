info:
  name: change-password
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/auth/reset-password"
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
          "reset_token": "{{resetToken}}",
          "password": "Password123!",
          "password_confirmation": "Password123!"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  #### POST /api/auth/reset-password — AuthController@changePassword
  - **Deskripsi**: Ganti password via `resetToken` dari `verify-code`.
  - **Middleware & Auth**: Publik (throttle:3,15). Sumber: `routes/api.php:84`.
  - **Request** (`ChangePasswordRequest.php:14-21`): `resetToken` required;
    `password` required/min:8/confirmed; `password_confirmation` required.
  - **Alur Proses** (`AuthService::changePassword`, `app/Services/AuthService.php:109-128`):
    findValidResetToken (verified_at not null, used_at null, expired_at>now) →
    findByEmail → DB::transaction: updateTeamPassword (bcrypt via `Team.php:114-119`),
    markTokenAsUsed, `tokens()->delete()`.
  - **Database**: `auth_challenges` SELECT+UPDATE; `teams` UPDATE password;
    `personal_access_tokens` DELETE.
  - **Efek Samping**: revoke seluruh Sanctum token team.
  - **Response** (200): data null. (422) `INVALID_RESET_TOKEN` / `VALIDATION_ERROR`.
  - **Catatan**: Tidak ada.
