info:
  name: login
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
          "email": "{{teamEmail}}",
          "password": "{{teamPassword}}"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  #### POST /api/auth/login — AuthController@login
  - **Deskripsi**: Shared login Team/Admin dan penerbitan Sanctum Bearer token.
  - **Middleware & Auth**: Publik + `throttle:5,1` (maks 5 req/menit per IP).
    Sumber: `routes/api.php:81`.
  - **Request** (`LoginRequest.php:17-23`): `email` required/email;
    `password` required/string.
  - **Alur Proses**: cari Team/Admin, validasi password dan status Admin, revoke
    token lama, lalu buat token baru. Team belum verifikasi mendapat OTP baru.
  - **Database**: teams/admins, auth_challenges, dan personal_access_tokens.
  - **Efek Samping**: revoke token lama; login Team belum verifikasi mengirim email.
  - **Response** (200): token, principalType, principal, redirectTo, dan
    emailVerificationRequired.
    (401) `INVALID_CREDENTIALS`; (422) `VALIDATION_ERROR`.
  - **Catatan**: 429 memakai envelope API dan header Retry-After.
