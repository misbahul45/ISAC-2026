info:
  name: send-verification
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/verify-email/resend"
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  auth:
    type: bearer
    token: "{{apiToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  #### POST /api/auth/verify-email/resend — AuthController@sendVerification
  - **Deskripsi**: Kirim ulang OTP verifikasi email.
  - **Middleware & Auth**: auth:sanctum (throttle:1,1). Sumber: `routes/api.php:89`.
  - **Request**: body kosong; Team diambil dari Bearer token.
  - **Alur Proses**: invalidasi challenge VERIFY_EMAIL lama, simpan hash OTP baru,
    lalu kirim melalui transactional mail provider di dalam transaksi.
  - **Database**: `auth_challenges` UPDATE/INSERT.
  - **Efek Samping**: kirim email OTP.
  - **Response** (200): data null; email sudah verified menghasilkan error domain.
  - **Catatan**: Tidak ada.
