info:
  name: send-verification
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/verify-email/resend"
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  body:
    type: json
    data: |-
      {
          "email": "lkiokijoap@gmail.com"
      }
  auth:
    type: bearer
    token: "{{apiToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  #### POST /api/auth/verify-email/resend — AuthController@sendVerification
  - **Deskripsi**: Kirim ulang OTP verifikasi email.
  - **Middleware & Auth**: auth:sanctum (throttle:1,1). Sumber: `routes/api.php:89`.
  - **Request** (`SendVerificationRequest.php:14-19`): `email` required/email/
    exists:teams,email.
  - **Alur Proses** (`AuthService::sendVerificationCode`, `app/Services/AuthService.php:140-166`):
    findByEmail (null → InvalidCredentialException) → cek status `EMAIL_UNVERIFIED`
    (sudah diverifikasi → InvalidCredentialException) → deleteOldVerificationCodes
    (filter type verify_email) → generate 6 digit → simpan type verify_email →
    kirim `VerifyEmailMail`.
  - **Database**: `password_reset_codes` DELETE (filter verify_email) + INSERT.
  - **Efek Samping**: kirim `VerifyEmailMail`.
  - **Response** (200): data null. (422) `VALIDATION_ERROR` (email tak terdaftar).
  - **Catatan**: Tidak ada.
