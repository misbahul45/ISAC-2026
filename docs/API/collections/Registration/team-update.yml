docs: |-
  #### PATCH /api/registrations/me/team — RegistrationController@updateTeam
  - **Deskripsi**: Update data tim (nama, nomor telepon, sekolah). Tidak perlu file/dokumen — itu di endpoint dokumen.
  - **Middleware & Auth**: `auth:sanctum`. Sumber: `routes/api.php:66`.
  - **Request** (validasi `UpdateTeamRequest`,
    `app/Http/Requests/Registration/UpdateTeamRequest.php:12-22`):
    - `name`: required, string, max:255
    - `phone`: required, string, max:20
    - `institution_name`: required, string, min:3, max:255
    - `institution_address`: required JSON string dengan key `province`, `city`, dan `address`
  - **Alur Proses** (`RegistrationService::updateTeamData`, `app/Services/RegistrationService.php:78-112`):
    1. Cek registration ada.
    2. `$team->update(...)` — update kolom.
    3. Jika `team_completed_at` null → set `now()` (first time).
    4. Jika team dalam status `REVISION_REQUIRED` → set `WAITING_VERIFICATION`, reset `verified_at`/`verified_by` (revision resubmit).
  - **Database yang Terkena**: `teams` — UPDATE; `registrations` — UPDATE (`team_completed_at`).
  - **Efek Samping**: Jika `team_completed_at` baru di-set, progress registrasi bertambah.
  - **Response** (200): `{status, message, data: TeamFormResource, metadata, error}`.
    (422) validasi gagal; (422) belum pilih kompetisi.
