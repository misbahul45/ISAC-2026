docs: |-
  #### GET /api/registrations/me/members — RegistrationController@getMembers
  - **Deskripsi**: Ambil daftar anggota tim untuk form biodata.
  - **Middleware & Auth**: `auth:sanctum`. Sumber: `routes/api.php:67`.
  - **Request**: Header `Authorization: Bearer <token>`.
  - **Alur Proses**: `$team->load('members')` → `MembersFormResource::collection($team->members)`.
    `MembersFormResource` (`app/Http/Resources/MembersFormResource.php:16-31`):
    id, name, role, email, phone, major, faculty, studentId, birthDate, educationLevel, photoFileId, sortOrder.
  - **Database yang Terkena**: `teams` — SELECT; `members` — SELECT (eager load).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): `{status, message, data: [MembersFormResource, ...], metadata, error}`.
