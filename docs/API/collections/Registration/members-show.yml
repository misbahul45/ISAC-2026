docs: |-
  #### GET /api/registrations/me/members — RegistrationController@getMembers
  - **Deskripsi**: Ambil daftar anggota tim untuk form biodata.
  - **Middleware & Auth**: `auth:sanctum`. Sumber: `routes/api.php:67`.
  - **Request**: Header `Authorization: Bearer <token>`.
  - **Alur Proses**: memuat Competition dan members terurut. Response membawa
    participantCategory, identityLabel, min/max Member, revisionNote, serta
    id, name, role, email, major, faculty, studentId, photoFileId, dan sortOrder.
  - **Database yang Terkena**: `teams` — SELECT; `members` — SELECT (eager load).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): envelope dengan `MembersPageData`; Business Competition
    mengembalikan minMembers=3 dan maxMembers=3, Olimpiade 1 dan 1.
