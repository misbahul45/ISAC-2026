docs: |-
  #### GET /api/registrations/me/team — RegistrationController@getTeam
  - **Deskripsi**: Ambil data tim untuk form data tim (nama, sekolah, kontak).
  - **Middleware & Auth**: `auth:sanctum`. Sumber: `routes/api.php:65`.
  - **Request**: Header `Authorization: Bearer <token>`.
  - **Alur Proses**: `$team` langsung → `new TeamFormResource($team)`.
    `TeamFormResource` (`app/Http/Resources/TeamFormResource.php:17-30`):
    id, code, email, name, phone, schoolName, schoolProvince, schoolCity, schoolAddress.
  - **Database yang Terkena**: `teams` — SELECT (Auth::user()).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): `{status, message, data: TeamFormResource, metadata, error}`.
