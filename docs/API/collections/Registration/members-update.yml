docs: |-
  #### PUT /api/registrations/me/members — RegistrationController@updateMembers
  - **Deskripsi**: Finalisasi data anggota tim (upsert). HAPUS semua anggota lama + INSERT ulang (full replacement).
  - **Middleware & Auth**: `auth:sanctum`. Sumber: `routes/api.php:68`.
  - **Request** (validasi `FinalizeMembersRequest`,
    `app/Http/Requests/Registration/FinalizeMembersRequest.php:12-27`):
    - `members`: required, array, min:1, max:3
    - `members.*.name`: required, string, max:255
    - `members.*.role`: required, string, `in:LEADER,MEMBER` (harus tepat 1 LEADER)
    - `members.*.email`: required, email, max:255
    - `members.*.major` dan `faculty`: wajib untuk Business IT Case, null untuk SMA
    - `members.*.student_id`: required string, max:50, distinct
    - `members.*.photo_file_id`: nullable UUID file milik Team dengan purpose MEMBER_PHOTO
  - **Alur Proses** (`RegistrationService::finalizeMembers`, `app/Services/RegistrationService.php:119-187`):
    1. Cek registration & team_completed_at ada.
    2. Validasi jumlah peserta: OLIMPIADE tepat 1; BUSINESS_PLAN / BUSINESS_IT_CASE tepat 3.
    3. Validasi tepat 1 LEADER.
    4. `$team->members()->delete()` + `Member::insert(...)` (full replacement).
    5. Jika `members_completed_at` null → set `now()`.
  - **Database yang Terkena**: `members` — DELETE (all old) + INSERT (new batch); `registrations` — UPDATE (`members_completed_at`).
  - **Efek Samping**: Semua data anggota lama dihapus dan diganti. `sort_order` di-reset berdasarkan urutan array (1-indexed).
  - **Response** (200): `{status, message, data: [MembersFormResource, ...], metadata, error}`.
    (422) validasi gagal atau jumlah anggota tidak sesuai kompetisi.
