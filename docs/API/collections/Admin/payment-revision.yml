http:
  method: POST
  url: "{{baseUrl}}/api/admin/registrations/{{registration_id}}/payment/revision"
  headers:
    - name: Accept
      value: application/json
    - name: X-Request-ID
      value: bruno-payment-revision
  body:
    type: json
    data: |-
      {
          "reason": "Bukti pembayaran tidak terbaca."
      }
