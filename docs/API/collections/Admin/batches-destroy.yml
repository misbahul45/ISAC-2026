docs: |-
  #### DELETE /api/admin/batches/{batch} — BatchController@destroy
  - **Deskripsi**: Hapus batch (soft delete).
  - **Middleware & Auth**: `auth:admins`. Sumber: `routes/api.php:58`.
  - **Request**: Path `{batch}` (UUID). Route model binding.
  - **Alur Proses** (`BatchService::deleteBatch`):
    Soft delete batch.
  - **Database yang Terkena**: `batches` — UPDATE `deleted_at`.
  - **Efek Samping**: Batch tidak aktif lagi.
  - **Response** (200): `{status, message, data: null, metadata, error}`.
