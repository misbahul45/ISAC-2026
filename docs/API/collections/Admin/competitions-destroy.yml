    Soft delete kompetisi (model uses `SoftDeletes`).
  - **Database yang Terkena**: `competitions` — UPDATE `deleted_at`.
  - **Efek Samping**: Kompetisi tidak aktif lagi, registrasi terkait tidak terhapus.
