info:
  name: teams-show
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/admin/teams/{{team_id}}"
  headers:
    - name: Accept
      value: application/json
  auth:
    type: bearer
    token: "{{adminToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  #### GET /api/admin/teams/{team}
  Mengambil detail Team, registration, peserta, Competition, dan Batch.
