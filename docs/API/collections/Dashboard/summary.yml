docs: |-
  #### GET /api/dashboard/summary — DashboardController@summary
  - **Deskripsi**: Ringkasan jumlah todo (total, aktif=belum selesai, selesai).
  - **Middleware & Auth**: Publik. Sumber: `routes/api.php:31`.
  - **Request**: Tidak ada.
  - **Alur Proses** (`DashboardService::getSummary` → `DashboardRepository::todoSummary`,
    `app/Repositories/DashboardRepository.php:13-23`):
    1. `Todo::count()` → total.
    2. `Todo::where('is_completed', true)->count()` → completed.
    3. `active = total - completed`.
    Dibungkus `DashboardSummaryResource` (`app/Http/Resources/DashboardSummaryResource.php`).
  - **Database yang Terkena**: `todos` — 2× SELECT COUNT
    (⚠️ lihat Lampiran B #1: tabel `todos` belum punya migration).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): `{status:'success', message:'Dashboard summary retrieved
    successfully.', data:{total, active, completed}}`.
  - **Catatan**: ⚠️ Hanya menghitung `todos`, padahal aplikasi punya domain
    Competition/Registration/Submission/Exam yang jauh lebih luas — kemungkinan
    placeholder. Perlu verifikasi manual.
