info:
  name: summary
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/dashboard/summary"
  headers:
    - name: Accept
      value: application/json
    - name: ""
      value: ""
  auth:
    type: bearer
    token: "{{apiToken}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  #### GET /api/dashboard/summary — DashboardController@summary
  - **Deskripsi**: Ringkasan status Team, registrasi, peserta, pembayaran, dan current Stage.
  - **Middleware & Auth**: `auth:sanctum`, `principal.team`, `team.verified`.
  - **Request**: Tidak ada.
  - **Alur Proses**: `DashboardService` memuat Team beserta members, registration,
    competition, batch, payment proof, payment stage, dan current Stage.
  - **Database yang Terkena**: teams, members, registrations, competitions, batches,
    files, dan stages (read only).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): envelope canonical dengan `DashboardSummaryResource`.
