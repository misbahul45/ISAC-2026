docs: |-
  #### GET /api/teams/me — TeamController@show
  - **Deskripsi**: Profil lengkap team terautentikasi.
  - **Middleware & Auth**: `auth:sanctum`. Sumber: `routes/api.php:34`.
  - **Request**: Header `Authorization: Bearer <token>`.
  - **Alur Proses**: `new TeamResource($request->user())`
    (`TeamController.php:20-29`, `app/Http/Resources/TeamResource.php`).
  - **Database yang Terkena**: `teams` — SELECT (Auth::user()).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): `TeamResource` → id, code, email, name, phone,
    schoolName(school_name), schoolAddress(school_address),
    documentFileId(document_file_id), twibbonFileId(twibbon_file_id),
    status(uppercase), verifiedAt(verified_at→ISOString).
  - **Catatan**: Tidak ada.
