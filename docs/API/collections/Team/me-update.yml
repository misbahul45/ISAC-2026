docs: |-
  #### PATCH /api/teams/me — TeamController@update
  - **Deskripsi**: Update profil team (name, phone, school, file dokumen/twibbon).
  - **Middleware & Auth**: `auth:sanctum`. Sumber: `routes/api.php:35`.
  - **Request** (validasi `UpdateTeamRequest`,
    `app/Http/Requests/Team/UpdateTeamRequest.php:17-26`):
    - `name`: sometimes, required, string, min:2, max:255
    - `phone`: sometimes, nullable, string, max:20
    - `school_name`: sometimes, nullable, string, max:255
    - `school_address`: sometimes, nullable, string
    - `document_file_id`: sometimes, nullable, uuid, exists:`files,id`
    - `twibbon_file_id`: sometimes, nullable, uuid, exists:`files,id`
  - **Alur Proses**: `teamService->updateProfile($user, validated)` →
    `teamRepository->update($team, $data)` (`app/Services/TeamService.php:19-23`,
    `app/Repositories/TeamRepository.php:13-18`, lalu `$team->fresh()`).
  - **Database yang Terkena**: `teams` — UPDATE; `files` — SELECT (validasi
    `exists:files,id`, FK `document_file_id`/`twibbon_file_id` → `files.id`,
    migrasi `..._000006_create_teams_table.php:20-21`).
  - **Efek Samping**: Tidak ada.
  - **Response** (200): `{status:'success', message:'Team profile updated
    successfully.', data: TeamResource, metadata:{}, error:null}`.
  - **Catatan**: ⚠️ `document_file_id`/`twibbon_file_id` harus sudah ada di
    `files` (di-upload via `POST /files` dulu; tidak ada penciptaan otomatis).
